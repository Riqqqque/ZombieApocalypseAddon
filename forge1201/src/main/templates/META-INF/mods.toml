modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="zombielogo.png"
authors="${mod_authors}"
displayTest="IGNORE_SERVER_VERSION"
description='''
A server-side configurable zombie apocalypse gameplay addon for Forge 1.20.1.

Install this on the server. Clients do not need the mod to join.

Start with /za for a short dashboard, safe presets, and config help.

Core gameplay:
- Optional sunlight immunity for zombies.
- Custom day/night spawning near players.
- Optional zombie block breaking, block placing, and swarm towering.
- Horde events and blood moon nights.
- Day-based difficulty scaling.
- Death cooldown safety window.
- Persistent kill and cooldown statistics.

Use /za help for topic-based command help. Existing detailed commands remain available.
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
