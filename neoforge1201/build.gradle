import java.util.Properties

plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.144'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

def sharedProperties = new Properties()
file('../gradle.properties').withInputStream(sharedProperties.&load)
def shared = { String key -> sharedProperties.getProperty(key) }

version = shared('neoforge1201_release_version') ?: shared('forge1201_release_version') ?: shared('mod_version')
group = shared('mod_group_id')

repositories {
    mavenLocal()
}

base {
    archivesName = "${shared('mod_id')}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    enable {
        neoForgeVersion = project.neoforge_version
    }

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', shared('mod_id')
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', shared('mod_id')
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'forge.enabledGameTestNamespaces', shared('mod_id')
        }

        data {
            data()
            programArguments.addAll '--mod', shared('mod_id'), '--all',
                    '--output', file('../src/generated/resources/').getAbsolutePath(),
                    '--existing', file('../src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${shared('mod_id')}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets {
    main {
        java {
            srcDir '../forge1201/src/main/java'
        }
        resources {
            srcDirs = ['../src/main/resources', '../src/generated/resources', '../forge1201/src/main/resources', 'src/main/resources']
            exclude 'META-INF/neoforge.mods.toml'
            exclude 'data/**/advancement/**'
            exclude 'data/**/tags/entity_type/**'
            exclude 'pack.mcmeta'
        }
    }
    test {
        java {
            setSrcDirs([])
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version        : minecraft_version,
            minecraft_version_range  : minecraft_version_range,
            neoforge_version         : neoforge_version,
            neoforge_version_range   : neoforge_version_range,
            loader_version_range     : loader_version_range,
            mod_id                   : shared('mod_id'),
            mod_name                 : shared('mod_name'),
            mod_license              : shared('mod_license'),
            mod_version              : version,
            mod_authors              : 'Rique',
            mod_description          : 'A configurable zombie apocalypse gameplay addon for NeoForge 1.20.1.'
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.named('processResources', ProcessResources).configure {
    from('../forge1201/src/main/resources/pack.mcmeta')
}

tasks.named('compileJava', JavaCompile).configure {
    source fileTree('../src/main/java') {
        exclude 'com/rique/zombieapocalypse/ApocalypseWorldData.java'
        exclude 'com/rique/zombieapocalypse/Config.java'
        exclude 'com/rique/zombieapocalypse/DifficultyManager.java'
        exclude 'com/rique/zombieapocalypse/EventHandler.java'
        exclude 'com/rique/zombieapocalypse/LoadedMods.java'
        exclude 'com/rique/zombieapocalypse/ModCommands.java'
        exclude 'com/rique/zombieapocalypse/SpawnCompatibilityHooks.java'
        exclude 'com/rique/zombieapocalypse/StatisticsManager.java'
        exclude 'com/rique/zombieapocalypse/TowerRiderPosition.java'
        exclude 'com/rique/zombieapocalypse/ZombieApocalypseAddon.java'
        exclude 'com/rique/zombieapocalypse/ZombieKillAdvancements.java'
        exclude 'com/rique/zombieapocalypse/commands/AttributeCommands.java'
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = file("repo").toURI()
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
}

tasks.named('test', Test).configure {
    enabled = false
}

tasks.named('compileTestJava', JavaCompile).configure {
    enabled = false
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
