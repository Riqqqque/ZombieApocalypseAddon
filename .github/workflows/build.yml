name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test all supported loaders
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Fix Gradle wrapper permissions
        run: chmod +x gradlew

      - name: Check Markdown tables
        shell: pwsh
        run: ./scripts/check-markdown-tables.ps1

      - name: Check live wiki Markdown tables
        shell: pwsh
        run: |
          $wikiDir = Join-Path $env:RUNNER_TEMP 'ZombieApocalypseAddon.wiki'
          git clone --depth 1 "https://github.com/${{ github.repository }}.wiki.git" $wikiDir
          ./scripts/check-markdown-tables.ps1 -Path $wikiDir

      - name: Build with Gradle
        run: ./gradlew build --console=plain --warning-mode all
